<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UDA Growth Coach</title>
<style>
  :root {
    --bg: #131217;          /* deep near-black stage */
    --panel: #1b1a21;       /* header & sidebar: dark */
    --panel2: #ffffff;      /* boxes: crisp white */
    --text: #f2f0f7;        /* text on dark */
    --ink: #1d1b26;         /* text on white boxes */
    --muted: #a29fae; --accent: #7c3aed; --accent2: #a78bfa;
    --green: #34d399; --border: #2e2c38;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); 
           display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
  header h1 { font-size: 16px; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; margin-left: auto; }

  #layout { flex: 1; display: flex; flex-direction: column; min-height: 0; align-items: center; }

  /* conversation: centred column, anchored to bottom near the input */
  #chatcol { flex: 1; display: flex; flex-direction: column; min-height: 0; width: 100%; max-width: 1080px; }
  #chat { flex: 1; overflow-y: auto; padding: 22px 20px 10px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 13px 17px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word;
         box-shadow: 0 2px 10px rgba(0,0,0,.35); font-size: 15.5px; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: var(--panel2); color: var(--ink); border-bottom-left-radius: 4px; }
  .sources { align-self: flex-start; font-size: 11px; color: var(--muted); margin-top: -6px; padding-left: 6px; max-width: 88%; }
  .sources .srclabel { margin: 2px 0 4px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .sources a.lesson {
    display: inline-flex; align-items: center; gap: 7px;
    background: #ffffff; color: #5b21b6; text-decoration: none;
    border: 1.5px solid #ddd6f3; border-radius: 999px;
    padding: 9px 18px 9px 13px; margin: 4px 8px 3px 0;
    font-weight: 700; font-size: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .sources a.lesson:hover { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 10px; }

  /* input area: bottom of the column, chips directly above it */
  #inputcol { width: 100%; max-width: 1080px; padding: 8px 20px 18px; display: flex; flex-direction: column; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--panel2); border: none; color: var(--ink);
          padding: 9px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer;
          box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .chip:hover { outline: 2px solid var(--accent); }
  #inputrow { display: flex; gap: 10px; align-items: flex-end; }
  #input { flex: 1; min-height: 54px; max-height: 180px; resize: none; background: var(--panel2); color: var(--ink);
           border: none; border-radius: 14px; padding: 15px 16px; font: inherit; font-size: 15.5px;
           box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  #input::placeholder { color: #8a8794; }
  #input:focus { outline: 2px solid var(--accent); }
  #sendBtn { background: var(--accent); border: none; color: #fff; padding: 15px 26px;
             border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; }
  #sendBtn:hover { background: var(--accent2); }
  #sendBtn:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 11px; color: var(--muted); text-align: right; }

  #reqbar { display: none; }
  #reqbar button { background: transparent; color: var(--accent2); border: 1.5px solid var(--accent);
                   border-radius: 999px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  #reqbar button:hover { background: var(--accent); color: #fff; }

  /* email gate */
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #gate .card { background: var(--panel2); color: var(--ink); padding: 32px; border-radius: 18px;
                width: min(400px, 92vw); text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  #gate .card p { color: #57545f; }
  #gate h2 { margin-bottom: 8px; }
  #gate p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  #gate input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #d9d6e4;
                background: #fff; color: var(--ink); font: inherit; margin-bottom: 12px; }
  #gate button { width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--accent);
                 color: #fff; font-weight: 600; cursor: pointer; }

</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h2>UDA Growth Coach</h2>
    <p>Your AI coach trained on the full UDA Scale Academy library. Enter your member email to begin.</p>
    <input id="email" type="email" placeholder="you@youragency.com" />
    <button onclick="saveEmail()">Start coaching</button>
  </div>
</div>

<header>
  <div class="dot"></div>
  <h1>UDA Growth Coach</h1>
  <span>Powered by the UDA Scale Academy library</span>
</header>

<div id="layout">
  <div id="chatcol">
    <div id="chat"></div>
  </div>

  <div id="inputcol">
    <div class="chips" id="chips">
      <button class="chip" onclick="useChip(this)">I'm stuck getting new clients</button>
      <button class="chip" onclick="useChip(this)">Profit is thin - where do I start?</button>
      <button class="chip" onclick="useChip(this)">I'm scared to raise my prices</button>
      <button class="chip" onclick="useChip(this)">Build me a 30-day plan</button>
    </div>
    <div id="reqbar"><button onclick="requestContent()">📩 Request this content from Liza</button></div>
    <div id="inputrow">
      <textarea id="input" rows="1" placeholder="Tell me about your agency, or ask about anything in the academy..."
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</div>

<script>
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const reqbar = document.getElementById("reqbar");
let messages = [];
let memberEmail = localStorage.getItem("uda_email") || "";
let lastUserQuestion = "";

if (memberEmail) document.getElementById("gate").style.display = "none";

function saveEmail() {
  const v = document.getElementById("email").value.trim();
  if (!/.+@.+\..+/.test(v)) { alert("Please enter a valid email"); return; }
  memberEmail = v;
  localStorage.setItem("uda_email", v);
  document.getElementById("gate").style.display = "none";
  greet();
}

function useChip(el) {
  inputEl.value = el.textContent;
  inputEl.focus();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderRich(text) {
  // escape first, then linkify [text](url) and bare URLs; light bold support
  let html = esc(text);
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a class="lesson" href="$2" target="_blank" rel="noopener"><span class="ico">📖</span>$1<span class="arrow">↗</span></a>');
  html = html.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return html;
}
function add(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  if (role === "user") div.textContent = text;
  else div.innerHTML = renderRich(text);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addSources(sources) {
  if (!sources || !sources.length) return;
  const linked = sources.filter((s) => s.url);
  const div = document.createElement("div");
  div.className = "sources";
  if (linked.length) {
    const seen = new Set();
    let html = '<div class="srclabel">Lessons for this:</div>';
    for (const s of linked) {
      if (seen.has(s.url)) continue;
      seen.add(s.url);
      if (seen.size > 4) break;
      html += '<a class="lesson src" href="' + s.url + '" target="_blank" rel="noopener">' +
              '<span class="ico">📖</span>' + esc(s.title) + '<span class="arrow">↗</span></a>';
    }
    div.innerHTML = html;
  } else {
    const uniq = [...new Set(sources.map((s) => s.course))].slice(0, 3);
    div.textContent = "Drawing on: " + uniq.join(" · ");
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function greet() {
  if (messages.length) return;
  const g = "Hey! I'm your UDA Growth Coach - trained on every course, masterclass and tool in the academy.\n\nYou can ask me anything from the library, or tell me where your agency's at right now (revenue, clients, what's feeling stuck) and I'll help you find the real constraint and map your next steps.\n\n💡 Tip: make sure you're logged in to the community in this browser, so the lesson links I give you open straight into the content.";
  add("assistant", g);
  messages.push({ role: "assistant", content: g });
}
if (memberEmail) greet();

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  lastUserQuestion = text;
  reqbar.style.display = "none";
  document.getElementById("chips").style.display = "none";
  add("user", text);
  messages.push({ role: "user", content: text });
  sendBtn.disabled = true;
  const typing = document.createElement("div");
  typing.className = "typing"; typing.textContent = "Coach is thinking...";
  chatEl.appendChild(typing); chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages, email: memberEmail }),
    });
    const data = await r.json();
    typing.remove();
    if (data.reply) {
      add("assistant", data.reply);
      addSources(data.sources);
      messages.push({ role: "assistant", content: data.reply });
      if (/request this content|don't have|do not have|not covered|may not have that content/i.test(data.reply)) {
        reqbar.style.display = "block";
      }
    } else {
      add("assistant", "Sorry - something went wrong on my end. Try again in a moment.");
    }
  } catch (e) {
    typing.remove();
    add("assistant", "Connection hiccup - please try again.");
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

async function requestContent() {
  reqbar.style.display = "none";
  try {
    await fetch("/api/request-content", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: lastUserQuestion,
        email: memberEmail,
        context: messages.slice(-6).map((m) => m.role + ": " + m.content).join("\n"),
      }),
    });
    add("assistant", "Done - I've sent that request through to Liza so she can see what content members are looking for. 🙌");
  } catch (e) {
    add("assistant", "Couldn't send the request just now - try again shortly.");
  }
}
</script>
</body>
</html>
