<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UDA Growth Coach</title>
<style>
  :root {
    --bg: #131217;          /* deep near-black stage */
    --panel: #1b1a21;       /* header & sidebar: dark */
    --panel2: #ffffff;      /* boxes: crisp white */
    --text: #f2f0f7;        /* text on dark */
    --ink: #1d1b26;         /* text on white boxes */
    --muted: #a29fae; --accent: #7c3aed; --accent2: #a78bfa;
    --green: #34d399; --border: #2e2c38;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); 
           display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
  header h1 { font-size: 16px; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; margin-left: auto; }

  #layout { flex: 1; display: flex; min-height: 0; }

  /* LEFT: conversation */
  #chatcol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 88%; padding: 12px 16px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word;
         box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: var(--panel2); color: var(--ink); border-bottom-left-radius: 4px; }
  .bot a { color: #6d28d9; text-decoration: underline; font-weight: 600; }
  .sources { align-self: flex-start; font-size: 11px; color: var(--muted); margin-top: -8px; padding-left: 6px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 10px; }

  /* RIGHT: input panel */
  #inputcol { width: 360px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--border);
              padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  #inputcol h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #input { width: 100%; min-height: 140px; resize: vertical; background: var(--panel2); color: var(--ink);
           border: none; border-radius: 12px; padding: 12px 14px; font: inherit;
           box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  #input::placeholder { color: #8a8794; }
  #input:focus { outline: none; border-color: var(--accent); }
  #sendBtn { width: 100%; background: var(--accent); border: none; color: #fff; padding: 12px;
             border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; }
  #sendBtn:hover { background: var(--accent2); }
  #sendBtn:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 11px; color: var(--muted); }

  .chips { display: flex; flex-direction: column; gap: 8px; }
  .chip { text-align: left; background: var(--panel2); border: none; color: var(--ink);
          padding: 10px 12px; border-radius: 10px; font-size: 13px; cursor: pointer;
          box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .chip:hover { outline: 2px solid var(--accent); }

  #reqbar { display: none; }
  #reqbar button { width: 100%; background: transparent; color: var(--accent2); border: 1px solid var(--accent);
                   border-radius: 10px; padding: 10px; font-size: 13px; cursor: pointer; }
  #reqbar button:hover { background: var(--accent); color: #fff; }

  /* email gate */
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #gate .card { background: var(--panel2); color: var(--ink); padding: 32px; border-radius: 18px;
                width: min(400px, 92vw); text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  #gate .card p { color: #57545f; }
  #gate h2 { margin-bottom: 8px; }
  #gate p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  #gate input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #d9d6e4;
                background: #fff; color: var(--ink); font: inherit; margin-bottom: 12px; }
  #gate button { width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--accent);
                 color: #fff; font-weight: 600; cursor: pointer; }

  /* Narrow screens (mobile / slim Circle embeds): stack vertically */
  @media (max-width: 760px) {
    #layout { flex-direction: column; }
    #inputcol { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    #input { min-height: 70px; }
    .chips { display: none; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h2>UDA Growth Coach</h2>
    <p>Your AI coach trained on the full UDA Scale Academy library. Enter your member email to begin.</p>
    <input id="email" type="email" placeholder="you@youragency.com" />
    <button onclick="saveEmail()">Start coaching</button>
  </div>
</div>

<header>
  <div class="dot"></div>
  <h1>UDA Growth Coach</h1>
  <span>Powered by the UDA Scale Academy library</span>
</header>

<div id="layout">
  <div id="chatcol">
    <div id="chat"></div>
  </div>

  <div id="inputcol">
    <div>
      <h2>Ask your coach</h2>
    </div>
    <textarea id="input" placeholder="Tell me about your agency, or ask about anything in the academy..."
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    <button id="sendBtn" onclick="send()">Send</button>
    <div class="hint">Enter to send &middot; Shift+Enter for a new line</div>

    <div id="reqbar"><button onclick="requestContent()">📩 Request this content from Liza</button></div>

    <div class="chips" id="chips">
      <h2>Quick starts</h2>
      <button class="chip" onclick="useChip(this)">I'm stuck getting new clients - help me find the constraint</button>
      <button class="chip" onclick="useChip(this)">Revenue is okay but profit is thin - where do I start?</button>
      <button class="chip" onclick="useChip(this)">I want to raise my prices but I'm scared to</button>
      <button class="chip" onclick="useChip(this)">Build me a 30-day plan from where my agency is now</button>
    </div>
  </div>
</div>

<script>
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const reqbar = document.getElementById("reqbar");
let messages = [];
let memberEmail = localStorage.getItem("uda_email") || "";
let lastUserQuestion = "";

if (memberEmail) document.getElementById("gate").style.display = "none";

function saveEmail() {
  const v = document.getElementById("email").value.trim();
  if (!/.+@.+\..+/.test(v)) { alert("Please enter a valid email"); return; }
  memberEmail = v;
  localStorage.setItem("uda_email", v);
  document.getElementById("gate").style.display = "none";
  greet();
}

function useChip(el) {
  inputEl.value = el.textContent;
  inputEl.focus();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderRich(text) {
  // escape first, then linkify [text](url) and bare URLs; light bold support
  let html = esc(text);
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return html;
}
function add(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  if (role === "user") div.textContent = text;
  else div.innerHTML = renderRich(text);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addSources(sources) {
  if (!sources || !sources.length) return;
  const uniq = [...new Set(sources.map((s) => s.course))].slice(0, 3);
  const div = document.createElement("div");
  div.className = "sources";
  div.textContent = "Drawing on: " + uniq.join(" · ");
  chatEl.appendChild(div);
}

function greet() {
  if (messages.length) return;
  const g = "Hey! I'm your UDA Growth Coach - trained on every course, masterclass and tool in the academy.\n\nYou can ask me anything from the library, or tell me where your agency's at right now (revenue, clients, what's feeling stuck) and I'll help you find the real constraint and map your next steps.";
  add("assistant", g);
  messages.push({ role: "assistant", content: g });
}
if (memberEmail) greet();

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  lastUserQuestion = text;
  reqbar.style.display = "none";
  add("user", text);
  messages.push({ role: "user", content: text });
  sendBtn.disabled = true;
  const typing = document.createElement("div");
  typing.className = "typing"; typing.textContent = "Coach is thinking...";
  chatEl.appendChild(typing); chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages, email: memberEmail }),
    });
    const data = await r.json();
    typing.remove();
    if (data.reply) {
      add("assistant", data.reply);
      addSources(data.sources);
      messages.push({ role: "assistant", content: data.reply });
      if (/request this content|don't have|do not have|not covered|may not have that content/i.test(data.reply)) {
        reqbar.style.display = "block";
      }
    } else {
      add("assistant", "Sorry - something went wrong on my end. Try again in a moment.");
    }
  } catch (e) {
    typing.remove();
    add("assistant", "Connection hiccup - please try again.");
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

async function requestContent() {
  reqbar.style.display = "none";
  try {
    await fetch("/api/request-content", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: lastUserQuestion,
        email: memberEmail,
        context: messages.slice(-6).map((m) => m.role + ": " + m.content).join("\n"),
      }),
    });
    add("assistant", "Done - I've sent that request through to Liza so she can see what content members are looking for. 🙌");
  } catch (e) {
    add("assistant", "Couldn't send the request just now - try again shortly.");
  }
}
</script>
</body>
</html>
